<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#070a0f" />
    </linearGradient>

    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e1ff" />
      <stop offset="50%" stop-color="#0CF709" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e1ff" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#0CF709" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00e1ff" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0CF709" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#00e1ff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0CF709" stop-opacity="0.05" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.8" fill="#1b2533" />
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="896" height="196" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  <rect x="2" y="2" width="896" height="196" rx="14" fill="url(#grid)" />

  <!-- Terminal Header Bar -->
  <rect x="2" y="2" width="896" height="34" rx="14" fill="#080c12" fill-opacity="0.8" />
  <path d="M 2 36 L 898 36" stroke="#1e293b" stroke-width="1" />
  <circle cx="24" cy="19" r="5" fill="#ef4444" />
  <circle cx="40" cy="19" r="5" fill="#f59e0b" />
  <circle cx="56" cy="19" r="5" fill="#10b981" />
  <text x="76" y="23" font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace" font-size="11" fill="#64748b" letter-spacing="1">kimeu.dev ~ /bin/bash</text>
  <text x="876" y="23" font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace" font-size="11" fill="#0CF709" text-anchor="end">SYS_STATUS: ONLINE</text>

  <!-- Flowing Tech Waves at Base -->
  <path d="M 2 155 Q 220 120 450 160 T 898 145 L 898 198 L 2 198 Z" fill="url(#wave1)" />
  <path d="M 2 170 Q 250 145 520 175 T 898 165 L 898 198 L 2 198 Z" fill="url(#wave2)" />
  <path d="M 2 165 Q 280 135 560 170 T 898 158" fill="none" stroke="#0CF709" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Main Title with Glow -->
  <g filter="url(#glow)">
    <text x="450" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="40" fill="#0CF709" letter-spacing="4" text-anchor="middle">
      KYALO ISAAC KIMEU
    </text>
  </g>
  <text x="450" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="40" fill="url(#neonGrad)" letter-spacing="4" text-anchor="middle">
    KYALO ISAAC KIMEU
  </text>

  <!-- Subtitle -->
  <text x="450" y="124" font-family="'JetBrains Mono', 'Consolas', monospace" font-weight="700" font-size="14" fill="#00e1ff" letter-spacing="3" text-anchor="middle">
    WEB DEVELOPER  ·  ALGORITHMIC SYSTEMS &amp; DATA ANALYSIS
  </text>

  <!-- Tagline / Location Pill -->
  <g transform="translate(450, 148)">
    <rect x="-185" y="-12" width="370" height="24" rx="12" fill="#0f172a" stroke="#0CF709" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="-168" cy="0" r="3.5" fill="#0CF709" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#94a3b8" letter-spacing="1" text-anchor="middle">
      Building clever systems, one algorithm at a time
    </text>
  </g>
</svg>
